<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Data Analyzer</title>
<link rel="stylesheet" href="./style.css">
<link rel="icon" type="image/png" href="./Images/csv_logo.png">
</head>
<body>
<main>
  <section id="uploadScreen">
    <label for="csvFile" class="upload-dropzone" id="uploadDropzone">
      <span class="upload-icon">&#8593;</span>
      <span class="upload-choose-btn">Choose File</span>
      <span class="upload-subtext">or drop your CSV file here</span>
    </label>
    <input type="file" id="csvFile" accept=".csv" />
    <p id="uploadError" class="message message--error" hidden></p>
  </section>

  <section id="dataScreen" hidden>
    <div class="data-screen-header">
      <p id="uploadSuccess" class="message message--success"></p>
      <button type="button" id="changeFileBtn" class="secondary-btn">Choose a different file</button>
    </div>

    <section class="card" id="previewCard" hidden>
      <p id="previewInfo" class="preview-info"></p>
      <p id="sortStatus" class="sort-status"></p>
      <div class="table-scroll">
        <table id="previewTable"></table>
      </div>
    </section>

    <section class="card" id="analysisCard" hidden>
      <div class="analysis-grid">
        <div class="analysis-box" id="columnStatsBox">
          <div class="analysis-box-header">
            <h3>Stats across column</h3>
            <button type="button" id="runColumnStatsBtn" class="primary-btn">Run</button>
          </div>
          <div class="control-group control-group--inline">
            <label for="columnFunctionSelect">Function</label>
            <select id="columnFunctionSelect">
              <option value="mode">Mode (most frequent value)</option>
              <option value="mean">Mean</option>
              <option value="median">Median</option>
              <option value="std">Standard Deviation</option>
              <option value="sum">Sum</option>
              <option value="unique">Unique Value Count + Values</option>
            </select>
          </div>
          <div class="control-group control-group--inline">
            <label for="columnSelect">Column</label>
            <select id="columnSelect"></select>
          </div>
        </div>

        <div class="analysis-divider" aria-hidden="true"><span>OR</span></div>

        <div class="analysis-box" id="rowStatsBox">
          <div class="analysis-box-header">
            <h3>Stats across row</h3>
            <button type="button" id="runRowStatsBtn" class="primary-btn">Run</button>
          </div>
          <div class="control-group control-group--inline">
            <label for="rowIndexInput">Row number</label>
            <input type="number" id="rowIndexInput" class="number-input-narrow" min="1" value="1" />
          </div>
          <p class="status-text">Compares this row's numeric values against the same columns across all other rows.</p>
        </div>
      </div>

      <div class="analysis-divider analysis-divider--horizontal" aria-hidden="true"><span>OR</span></div>

      <div class="analysis-box analysis-box--full" id="sqlOpsBox">
        <div class="analysis-box-header">
          <h3>SQL operations</h3>
          <button type="button" id="runSqlBtn" class="primary-btn">Run</button>
        </div>
        <div class="control-group control-group--inline">
          <label for="sqlFunctionSelect">Function</label>
          <select id="sqlFunctionSelect">
            <option value="filterCount">Count with Filters</option>
            <option value="query">SQL Query (SELECT / WHERE / ORDER BY / LIMIT)</option>
          </select>
        </div>

        <div class="control-group" id="selectControl" hidden>
          <label>SELECT columns</label>
          <div id="selectColumns" class="checkbox-list"></div>
        </div>

        <div class="sql-inline-row" id="sqlInlineRow">
          <div class="control-group" id="orderByControl" hidden>
            <label>ORDER BY</label>
            <div class="inline-fields">
              <select id="orderBySelect"><option value="">(none)</option></select>
              <select id="orderDirSelect">
                <option value="ASC">ASC</option>
                <option value="DESC">DESC</option>
              </select>
            </div>
          </div>

          <div class="control-group" id="whereControl" hidden>
            <label>WHERE (all conditions must match)</label>
            <div id="filterConditions"></div>
            <button type="button" id="addConditionBtn" class="secondary-btn">+ Add condition</button>
          </div>

          <div class="control-group" id="limitControl" hidden>
            <label for="limitInput">LIMIT</label>
            <input type="number" id="limitInput" class="number-input-narrow" min="0" value="10" />
          </div>
        </div>
      </div>
    </section>

    <section class="card" id="resultsCard" hidden>
      <div class="results-header">
        <h2>4. Results</h2>
        <button type="button" id="clearResultsBtn" class="secondary-btn">Clear results</button>
      </div>
      <div id="resultsOutput"></div>
    </section>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
